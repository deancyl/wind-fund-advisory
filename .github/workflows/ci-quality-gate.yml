name: CI Quality & Quantitative Integrity Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  TZ: Asia/Shanghai
  PYTHONUTF8: '1'

jobs:
  backend-quant-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run Phase 1 Quant Integrity, Seed Bootstrap & Infra Gate
        run: |
          python -m pytest tests/test_phase1_quant_integrity.py tests/test_akshare_compat_and_seed_bootstrap.py tests/test_infra.py -v

  frontend-build-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install & Build React Frontend
        working-directory: web
        run: |
          npm ci
          npm run build
