[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wind-advisor"
version = "0.1.0"
description = "Wind 投顾终端机制解析、数据抽取与智能投顾建议引擎"
authors = [
    { name = "Advisor Analytics Team" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "requests>=2.28.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "psutil>=5.9.0"
]

[project.scripts]
wind-advisor = "wind_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
