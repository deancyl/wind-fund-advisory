[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agy2-fund-advisory"
version = "2.1.2"
description = "AGY2 全天候智能投顾与公募基金量化接管系统 (Open-Source Quantitative Fund Advisory & Execution System)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Quantitative Systems Engineering Team" }
]
keywords = [
    "quantitative-finance",
    "fund-advisory",
    "asset-allocation",
    "hrp",
    "cvar",
    "portfolio-optimization",
    "risk-parity",
    "fastapi"
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "polars>=1.0.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "duckdb>=1.0.0",
    "requests>=2.32.0",
    "urllib3>=2.2.0",
    "httpx>=0.27.0",
    "akshare>=1.14.0",
    "pypinyin>=0.50.0",
    "Pillow>=10.0.0",
    "rich>=13.0.0",
    "psutil>=5.9.0"
]

[project.scripts]
agy2-advisor = "AGY2_FundAdvisory.app_gui:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "AGY2_FundAdvisory"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
